<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Salesforce AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 420px;
      max-height: 600px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 0;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .tabs {
      display: flex;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }
    
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: #6c757d;
      transition: all 0.3s;
    }
    
    .tab.active {
      color: #667eea;
      background: white;
      border-bottom: 2px solid #667eea;
    }
    
    .tab:hover {
      background: #f1f3f5;
    }
    
    .content {
      padding: 20px;
      max-height: 450px;
      overflow-y: auto;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .input-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
    }
    
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      resize: vertical;
      transition: border-color 0.3s;
    }
    
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    
    .result-box {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .field-editor {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }
    
    .field-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #f1f3f5;
    }
    
    .field-row:last-child {
      border-bottom: none;
    }
    
    .field-label {
      font-weight: 600;
      font-size: 12px;
      color: #495057;
    }
    
    .field-input {
      padding: 8px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .field-input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .chat-container {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    
    .chat-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    
    .chat-message.ai {
      background: #e7f3ff;
      border-left: 4px solid #667eea;
    }
    
    .chat-message.user {
      background: #f8f9fa;
      border-left: 4px solid #6c757d;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Salesforce AI Assistant</h1>
      <p>Crie registros usando linguagem natural</p>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-tab="ai">✨ IA Assistant</button>
      <button class="tab" data-tab="soql">🔍 SOQL</button>
    </div>
    
    <div class="content">
      <!-- ===== ABA IA ASSISTANT ===== -->
      <div id="ai-tab" class="tab-content active">
        <div class="input-group">
          <label>📝 Transcrição / Texto</label>
          <textarea id="transcription" rows="6" placeholder="Digite ou cole a transcrição aqui...&#10;&#10;Exemplo:&#10;'Criar um contato chamado João Silva, email joao@empresa.com, telefone 11 98765-4321, trabalha na Acme Corp'"></textarea>
        </div>
        
        <button id="processBtn" class="btn btn-primary">
          <span id="processBtnText">🚀 Processar com IA</span>
          <div id="processBtnSpinner" class="spinner hidden"></div>
        </button>
        
        <div id="statusBox"></div>
        
        <div id="chatBox" class="chat-container hidden"></div>
        
        <div id="correctionInput" class="input-group hidden">
          <label>💬 Sua resposta</label>
          <textarea id="userResponse" rows="3" placeholder="Digite sua resposta aqui..."></textarea>
          <button id="submitResponse" class="btn btn-primary">Enviar</button>
        </div>
        
        <div id="fieldEditor" class="field-editor hidden">
          <h3 style="margin-bottom: 12px; font-size: 14px;">✏️ Editar Dados</h3>
          <div id="fieldsContainer"></div>
          <div class="btn-group">
            <button id="confirmInsert" class="btn btn-success">✅ Confirmar</button>
            <button id="cancelInsert" class="btn btn-danger">❌ Cancelar</button>
          </div>
        </div>
        
        <div id="resultBox" class="result-box hidden"></div>
      </div>
      
      <!-- ===== ABA SOQL ===== -->
      <div id="soql-tab" class="tab-content">
        <div class="input-group">
          <label>🔍 Query SOQL</label>
          <textarea id="query" rows="5">SELECT Id, Name FROM Account LIMIT 5</textarea>
        </div>
        <button id="runQuery" class="btn btn-primary">▶️ Executar Query</button>
        <div id="queryResult" class="result-box hidden"></div>
      </div>
    </div>
  </div>
  
  <!-- Carrega scripts na ordem correta -->
  <script src="ai-processor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
