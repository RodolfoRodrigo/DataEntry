<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Salesforce Dev Helper</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 10px;
      width: 320px;
    }
    textarea {
      width: 100%;
      height: 100px;
      font-family: monospace;
      font-size: 12px;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 6px;
      background: #1589ee;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    pre {
      background: #f4f4f4;
      padding: 8px;
      margin-top: 8px;
      overflow: auto;
      max-height: 250px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h3>Executar SOQL</h3>
  <textarea id="query">SELECT Id, Name FROM Account LIMIT 5</textarea>
  <button id="run">Executar</button>
  <pre id="result"></pre>
  <script src="popup.js"></script>
</body>
</html>
